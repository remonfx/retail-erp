[package]
name = "retailcore-pos"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pos-store = { path = "../../../crates/pos-store", default-features = false, features = ["encrypted"] }
keyring = "3"
rand = "0.8"
hex = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
